<link rel="stylesheet" href="css/styles.css">

<hr>

<div id="contact-form" class="contact-form">
  <h2>Contact Me</h2>

  <form action="http://18.219.84.18/contact" method="POST">

    <label>Name</label><br>
    <input type="text" name="name" placeholder="Your Name" required><br><br>

    <label>Email Address</label><br>
    <input type="email" name="email" placeholder="Your Email Address" required><br><br>

    <label>Phone Number</label><br>
    <input type="tel" name="phone" placeholder="Your Phone Number"><br><br>

    <label>Message</label><br>
    <textarea name="message" rows="5" placeholder="Write your message here..." required></textarea><br><br>

    <button class="btn" type="submit">SEND MESSAGE</button>

  </form>
</div>
